name: Scheduled Database Backup

on:
  schedule:
    # Daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Dump PostgreSQL database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not configured; skipping backup."
            exit 0
          fi
          mkdir -p backups-ci
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          CLEAN_URL=$(echo "$DATABASE_URL" | sed 's|postgresql+psycopg://|postgresql://|')
          pg_dump --format=custom --no-owner --no-privileges --file="backups-ci/db-${STAMP}.dump" "$CLEAN_URL"
          sha256sum "backups-ci/db-${STAMP}.dump" > "backups-ci/db-${STAMP}.sha256"

      - name: Upload backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-backup-${{ github.run_id }}
          path: backups-ci/
          retention-days: 14
          if-no-files-found: ignore
